<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Making of Table</title>
</head>

<body>
    <table border="1">
        <caption>
            Time Table
        </caption>
        <tr>
            <th rowspan="2">
                TIME
                DAY
            </th>
            <th>
                I
            </th>
            <th>
                II
            </th>
            <th>
                III
            </th>
            <th>
                IV
            </th>
            <th>
                V
            </th>
            <th>
                VI
            </th>
            <th>
                VI
            </th>
            <th>
                VII
            </th>
            <th>
                VIII
            </th>
        </tr>
        <tr  >
            <th width="100">

                08:50 - 09:40
            </th>
            <th width="100">
                09:40 - 10:30
            </th>
            <th width="100">
                10:40 - 11:30
            </th>
            <th width="100">
                11:30 - 12:20
            </th>
            <th width="100">
                12:20 - 01:10
            </th>
            <th width="100">
                01:10 - 02:00
            </th>
            <th width="100">
                02:00 - 02:50
            </th>
            <th width="100">
                02:50 - 03:40
            </th>
            <th width="100">
                03:40 - 04:30
            </th>

        </tr>
        <tr>
            <th rowspan="4">
                MONDAY
            </th>
        </tr>

    </table>
</body>

</html>
